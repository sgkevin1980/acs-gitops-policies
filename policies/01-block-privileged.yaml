apiVersion: v1
kind: ConfigMap
metadata:
  name: acs-policy-block-privileged
  namespace: acs-policy-sync
  labels:
    app: acs-policy-sync
data:
  policy.json: |
    {
      "name": "GitOps - Block Privileged Containers",
      "description": "Deployed via GitOps. Alerts on containers running in privileged mode.",
      "rationale": "Privileged containers have full access to the host, breaking container isolation.",
      "remediation": "Remove 'privileged: true' from the container securityContext.",
      "categories": ["Security Best Practices"],
      "lifecycleStages": ["DEPLOY"],
      "severity": "HIGH_SEVERITY",
      "enforcementActions": ["SCALE_TO_ZERO_ENFORCEMENT"],
      "disabled": false,
      "policySections": [
        {
          "sectionName": "Privileged Container Check",
          "policyGroups": [
            {
              "fieldName": "Privileged Container",
              "values": [{"value": "true"}]
            }
          ]
        }
      ]
    }
