apiVersion: batch/v1
kind: Job
metadata:
  name: acs-policy-sync
  namespace: acs-policy-sync
  labels:
    app: acs-policy-sync
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: sync
        image: registry.access.redhat.com/ubi9/ubi:latest
        command:
        - /bin/bash
        - -c
        - |
          echo "=== ACS Policy GitOps Sync ==="
          CENTRAL_URL=$(cat /secrets/central-url)
          USERNAME=$(cat /secrets/username)
          PASSWORD=$(cat /secrets/password)

          sync_policy() {
            local file=$1
            local policy_name=$(python3 -c "import json; print(json.load(open('$file'))['name'])")
            echo ""
            echo "--- Syncing: $policy_name ---"

            # Check if policy already exists
            local existing_id=$(curl -sk -u "${USERNAME}:${PASSWORD}" \
              "${CENTRAL_URL}/v1/policies?query=" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          matches=[p['id'] for p in d.get('policies',[]) if p['name']=='$policy_name']
          print(matches[0] if matches else '')
          " 2>/dev/null)

            if [ -n "$existing_id" ]; then
              echo "  Exists (id=$existing_id). Updating..."
              local payload=$(python3 -c "
          import json
          p=json.load(open('$file'))
          p['id']='$existing_id'
          print(json.dumps(p))
          ")
              local http_code=$(curl -sk -u "${USERNAME}:${PASSWORD}" \
                "${CENTRAL_URL}/v1/policies/${existing_id}" \
                -X PUT -H "Content-Type: application/json" \
                -d "$payload" -o /dev/null -w "%{http_code}")
              echo "  HTTP $http_code"
            else
              echo "  Not found. Creating..."
              local http_code=$(curl -sk -u "${USERNAME}:${PASSWORD}" \
                "${CENTRAL_URL}/v1/policies" \
                -X POST -H "Content-Type: application/json" \
                -d @"$file" -o /dev/null -w "%{http_code}")
              echo "  HTTP $http_code"
            fi
          }

          echo "Scanning policy ConfigMaps..."
          for policy_file in /policies/*/policy.json; do
            [ -f "$policy_file" ] && sync_policy "$policy_file"
          done

          echo ""
          echo "=== Sync complete ==="
        volumeMounts:
        - name: secrets
          mountPath: /secrets
          readOnly: true
        - name: policy-block-privileged
          mountPath: /policies/block-privileged
          readOnly: true
        - name: policy-require-labels
          mountPath: /policies/require-labels
          readOnly: true
      volumes:
      - name: secrets
        secret:
          secretName: acs-credentials
      - name: policy-block-privileged
        configMap:
          name: acs-policy-block-privileged
      - name: policy-require-labels
        configMap:
          name: acs-policy-require-labels
